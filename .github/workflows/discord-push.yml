name: Discord Push Notifications

on:
  push:
    branches-ignore:
      - Main

jobs:
  notify:
    name: Notify Discord about branch push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_PUSH_WEBHOOK_URL }}
          USER_NAME: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_GITHUB_PUSH_WEBHOOK_URL secret; skipping Discord notification."
            exit 0
          fi

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            AMOUNT_LINES=$(git show --numstat --format="" "$AFTER_SHA" | awk '{ added += $1; deleted += $2 } END { print added + deleted + 0 }')
          else
            AMOUNT_LINES=$(git diff --numstat "$BEFORE_SHA" "$AFTER_SHA" | awk '{ added += $1; deleted += $2 } END { print added + deleted + 0 }')
          fi

          export AMOUNT_LINES
          export PUSHED_AT=$(TZ=Europe/Copenhagen date +"%d-%m-%Y %H:%M")
          export COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${AFTER_SHA}"

          python3 -c "import json, os; print(json.dumps({
            'username': 'GitHub',
            'embeds': [{
              'title': 'Nyt push',
              'description': f\"**{os.environ['USER_NAME']}** lavede et push med **{os.environ['AMOUNT_LINES']} linjer** til `{os.environ['BRANCH_NAME']}`.\",
              'color': 3447003,
              'fields': [
                {'name': 'Branch', 'value': os.environ['BRANCH_NAME'], 'inline': True},
                {'name': 'Linjer ændret', 'value': os.environ['AMOUNT_LINES'], 'inline': True},
                {'name': 'Tidspunkt', 'value': os.environ['PUSHED_AT'], 'inline': True},
                {'name': 'Commit', 'value': f\"[Åbn commit]({os.environ['COMMIT_URL']})\", 'inline': False}
              ],
              'footer': {'text': '4.Sem-Sys'}
            }]
          }))" \
            | curl --fail --silent --show-error \
                --header "Content-Type: application/json" \
                --data @- \
                "$DISCORD_WEBHOOK_URL"
