name: Backend CI/CD

on:
  push:
    branches:
      - Main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - Main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Build Java backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend
        run: mvn package

      - name: Prepare SSH
        if: github.ref == 'refs/heads/Main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Pull and build backend on server
        if: github.ref == 'refs/heads/Main'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" '
            set -e
            mkdir -p ~/4.Sem
            if [ ! -d ~/4.Sem/backend-repo/.git ]; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git clone git@github.com:Rovelt123/4.Sem-Sys.git ~/4.Sem/backend-repo
            fi
            cd ~/4.Sem/backend-repo
            GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git checkout Main
            GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git pull --ff-only origin Main
            cd backend
            mvn package
            mkdir -p ~/4.Sem/backend-app
            cp target/backend.jar ~/4.Sem/backend-app/backend.jar
            cd ~/docker-postgres
            docker compose up -d sys2-api
            sleep 5
            docker compose exec -T sys2-api wget -qO- http://127.0.0.1:7070/api/health
          '

      - name: Notify Discord about test result
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_TEST_WEBHOOK_URL }}
          TEST_STATUS: ${{ job.status == 'success' && 'Success' || 'failed' }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_GITHUB_TEST_WEBHOOK_URL secret; skipping Discord notification."
            exit 0
          fi

          TESTED_AT=$(TZ=Europe/Copenhagen date +"%d-%m-%Y %H:%M")
          export MESSAGE="Test have ${TEST_STATUS} on merge with branch ${BRANCH_NAME} at ${TESTED_AT}"

          python3 -c "import json, os; print(json.dumps({'content': os.environ['MESSAGE']}))" \
            | curl --fail --silent --show-error \
                --header "Content-Type: application/json" \
                --data @- \
                "$DISCORD_WEBHOOK_URL"
