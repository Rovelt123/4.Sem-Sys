name: Frontend CI/CD

on:
  push:
    branches:
      - Main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - Main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Build React Vite frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare SSH
        if: github.ref == 'refs/heads/Main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Pull and build frontend on server
        if: github.ref == 'refs/heads/Main'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" '
            set -e
            mkdir -p ~/4.Sem
            if [ ! -d ~/4.Sem/frontend-repo/.git ]; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git clone git@github.com:Rovelt123/4.Sem-Sys.git ~/4.Sem/frontend-repo
            fi
            cd ~/4.Sem/frontend-repo
            GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git checkout Main
            GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git pull --ff-only origin Main
            cd frontend
            docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/.npm -v "$PWD:/app" -w /app node:22-alpine sh -lc "npm ci && npm run build"
            mkdir -p ~/4.Sem/www/sys1
            cp -a dist/. ~/4.Sem/www/sys1/
          '

      - name: Notify Discord about test result
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_TEST_WEBHOOK_URL }}
          RAW_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          WORKFLOW_NAME: Frontend
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_GITHUB_TEST_WEBHOOK_URL secret; skipping Discord notification."
            exit 0
          fi

          if [ "$RAW_STATUS" = "success" ]; then
            export STATUS_TEXT="lykkedes"
            export STATUS_TITLE="Tests lykkedes"
            export STATUS_COLOR="3066993"
          else
            export STATUS_TEXT="fejlede"
            export STATUS_TITLE="Tests fejlede"
            export STATUS_COLOR="15158332"
          fi

          export TESTED_AT=$(TZ=Europe/Copenhagen date +"%d-%m-%Y %H:%M")
          export RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          python3 -c "import json, os; print(json.dumps({
            'username': 'GitHub Tests',
            'embeds': [{
              'title': f\"{os.environ['WORKFLOW_NAME']} - {os.environ['STATUS_TITLE']}\",
              'description': f\"Testene **{os.environ['STATUS_TEXT']}** ved merge/push med branch `{os.environ['BRANCH_NAME']}`.\",
              'color': int(os.environ['STATUS_COLOR']),
              'fields': [
                {'name': 'Workflow', 'value': os.environ['WORKFLOW_NAME'], 'inline': True},
                {'name': 'Branch', 'value': os.environ['BRANCH_NAME'], 'inline': True},
                {'name': 'Tidspunkt', 'value': os.environ['TESTED_AT'], 'inline': True},
                {'name': 'GitHub Actions', 'value': f\"[Åbn run]({os.environ['RUN_URL']})\", 'inline': False}
              ],
              'footer': {'text': '4.Sem-Sys'}
            }]
          }))" \
            | curl --fail --silent --show-error \
                --header "Content-Type: application/json" \
                --data @- \
                "$DISCORD_WEBHOOK_URL"
