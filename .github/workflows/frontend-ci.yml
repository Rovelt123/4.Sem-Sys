name: Frontend CI/CD

on:
  push:
    branches:
      - Main
      - Development
      - Review
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - Main
      - Development
      - Review
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Build React Vite frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare SSH
        if: github.ref == 'refs/heads/Main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Pull and build frontend on server
        if: github.ref == 'refs/heads/Main'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" '
            set -e
            mkdir -p ~/4.Sem
            if [ ! -d ~/4.Sem/frontend-repo/.git ]; then
              GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git clone git@github.com:Rovelt123/4.Sem-Sys.git ~/4.Sem/frontend-repo
            fi
            cd ~/4.Sem/frontend-repo
            GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git checkout Main
            GIT_SSH_COMMAND="ssh -i ~/.ssh/4_sem_sys_github_deploy -o StrictHostKeyChecking=accept-new" git pull --ff-only origin Main
            cd frontend
            docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/.npm -v "$PWD:/app" -w /app node:22-alpine sh -lc "npm ci && npm run build"
            mkdir -p ~/4.Sem/www/sys1
            cp -a dist/. ~/4.Sem/www/sys1/
          '
